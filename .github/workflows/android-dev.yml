name: Android CI & Release

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release tag name (e.g. v1.0.0; required if triggered via workflow_dispatch without a git tag)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Android APKs & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Assemble Android Release APKs
        run: ./gradlew :composeApp:assembleRelease --configuration-cache --no-daemon --stacktrace

      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kreader-release-arm64-v8a
          path: composeApp/build/outputs/apk/release/*arm64-v8a*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload armeabi-v7a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kreader-release-armeabi-v7a
          path: composeApp/build/outputs/apk/release/*armeabi-v7a*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload x86_64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kreader-release-x86_64
          path: composeApp/build/outputs/apk/release/*x86_64*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_meta
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.tag_name != ''))
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v1.0.0-$(date +'%Y%m%d%H%M%S')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: steps.release_meta.outputs.tag != ''
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          files: |
            composeApp/build/outputs/apk/release/*release*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
