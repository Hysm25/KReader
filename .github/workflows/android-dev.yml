name: Android Fast Dev Build

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Assemble Android APKs (Debug & Release)
        run: ./gradlew :composeApp:assembleDebug :composeApp:assembleRelease --configuration-cache --no-daemon --stacktrace

      - name: Upload arm64-v8a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kreader-debug-arm64-v8a
          path: composeApp/build/outputs/apk/debug/*arm64-v8a*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload armeabi-v7a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kreader-debug-armeabi-v7a
          path: composeApp/build/outputs/apk/debug/*armeabi-v7a*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload x86_64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kreader-debug-x86_64
          path: composeApp/build/outputs/apk/debug/*x86_64*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kreader-release-arm64-v8a
          path: composeApp/build/outputs/apk/release/*arm64-v8a*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload armeabi-v7a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kreader-release-armeabi-v7a
          path: composeApp/build/outputs/apk/release/*armeabi-v7a*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload x86_64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kreader-release-x86_64
          path: composeApp/build/outputs/apk/release/*x86_64*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
