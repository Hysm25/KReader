name: Multiplatform CI & Release

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release tag name (e.g. v1.0.0; required if triggered via workflow_dispatch without a git tag)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Android APKs & Arch Linux Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Ensure Keystore for Release Signing Fallback
        run: |
          mkdir -p ~/.android ~/.config/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" || true
          cp -f ~/.android/debug.keystore ~/.config/.android/debug.keystore 2>/dev/null || true

      - name: Assemble Android Release APKs
        run: ./gradlew :composeApp:assembleRelease --configuration-cache --no-daemon --stacktrace

      - name: Assemble Desktop Distributable
        run: ./gradlew :composeApp:createDistributable --no-daemon --stacktrace

      - name: Build Arch Linux .pkg.tar.zst Package
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c "
              pacman -Syu --noconfirm base-devel sudo zstd unzip &&
              useradd -m -s /bin/bash builder &&
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers &&
              chown -R builder:builder /workspace &&
              su builder -c 'cd /workspace && ./packaging/arch/build-package.sh' &&
              cd /workspace/packaging/arch/build &&
              sha256sum *.pkg.tar.zst > SHA256SUMS
            "

      - name: Verify Arch Linux Package Contents
        run: |
          echo "==> Inspecting generated Arch Linux package..."
          PKG_FILE=$(ls packaging/arch/build/*.pkg.tar.zst 2>/dev/null | head -n 1)
          if [ -z "$PKG_FILE" ] || [ ! -f "$PKG_FILE" ]; then
            echo "ERROR: Package file not found in packaging/arch/build/" >&2
            exit 1
          fi

          echo "Package: $PKG_FILE"
          ls -lh "$PKG_FILE"

          echo "==> Package contents sample:"
          tar -tf "$PKG_FILE" | head -n 25
          echo "..."
          tar -tf "$PKG_FILE" | tail -n 10

          JAR_COUNT=$(tar -tf "$PKG_FILE" | grep -c "\.jar$" || true)
          echo "Total JAR files in package: $JAR_COUNT"

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "ERROR: Arch Linux package contains 0 JAR files! Build failed." >&2
            exit 1
          fi

          tar -tf "$PKG_FILE" | grep "usr/bin/kreader" || (echo "ERROR: usr/bin/kreader missing!" >&2 && exit 1)
          tar -tf "$PKG_FILE" | grep "usr/share/applications/kreader.desktop" || (echo "ERROR: kreader.desktop missing!" >&2 && exit 1)
          tar -tf "$PKG_FILE" | grep "usr/share/icons/hicolor/scalable/apps/kreader.svg" || (echo "ERROR: kreader.svg missing!" >&2 && exit 1)

          echo "==> Verifying Skiko native Linux x64 runtime:"
          HAS_SKIKO_SHA256=0
          if tar -tf "$PKG_FILE" | grep -q "libskiko-linux-x64\.so\.sha256"; then
            echo "✓ Found libskiko-linux-x64.so.sha256 directly in package."
            HAS_SKIKO_SHA256=1
          fi

          # Inspect inside packaged JARs
          VERIFY_DIR=$(mktemp -d)
          tar -xf "$PKG_FILE" -C "$VERIFY_DIR"
          for jar in "$VERIFY_DIR"/usr/lib/kreader/lib/*.jar; do
            if [ -f "$jar" ] && unzip -l "$jar" 2>/dev/null | grep -q "libskiko-linux-x64\.so\.sha256"; then
              echo "✓ Found libskiko-linux-x64.so.sha256 inside $(basename "$jar")"
              HAS_SKIKO_SHA256=1
            fi
          done
          rm -rf "$VERIFY_DIR"

          if [ "$HAS_SKIKO_SHA256" -eq 0 ]; then
            echo "ERROR: libskiko-linux-x64.so.sha256 was NOT found in package or packaged JARs!" >&2
            exit 1
          fi

          echo "==> Package verification successful ($JAR_COUNT JARs present, Skiko native runtime verified)!"

      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kreader-release-arm64-v8a
          path: composeApp/build/outputs/apk/release/*arm64-v8a*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload armeabi-v7a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kreader-release-armeabi-v7a
          path: composeApp/build/outputs/apk/release/*armeabi-v7a*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload x86_64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kreader-release-x86_64
          path: composeApp/build/outputs/apk/release/*x86_64*.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload Arch Linux Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kreader-arch-pkg
          path: |
            packaging/arch/build/*.pkg.tar.zst
            packaging/arch/build/SHA256SUMS
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_meta
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.tag_name != ''))
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v1.0.0-$(date +'%Y%m%d%H%M%S')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: steps.release_meta.outputs.tag != ''
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          files: |
            composeApp/build/outputs/apk/release/*release*.apk
            packaging/arch/build/*.pkg.tar.zst
            packaging/arch/build/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
